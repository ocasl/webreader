<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320, initial-scale=1.0">
  <title>webreader</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 320px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      background: #f8f9fa;
      color: #1a1a2e;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 700;
    }

    .header .version {
      font-size: 10px;
      opacity: 0.8;
      background: rgba(255,255,255,0.2);
      padding: 2px 6px;
      border-radius: 10px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      font-size: 11px;
      border-bottom: 1px solid #e9ecef;
      background: white;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }
    .status-dot.connected { background: #22c55e; box-shadow: 0 0 4px #22c55e; }
    .status-dot.disconnected { background: #ef4444; }

    .actions {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s ease;
      width: 100%;
      text-align: left;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background: white;
      color: #374151;
      border: 1px solid #e5e7eb;
    }
    .btn-secondary:hover { background: #f3f4f6; border-color: #d1d5db; }

    .btn-icon { font-size: 16px; flex-shrink: 0; }

    .output-area {
      margin: 0 12px 12px;
      max-height: 250px;
      overflow-y: auto;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
    }
    .output-area.visible { display: block; }

    .loading {
      text-align: center;
      padding: 20px;
      color: #6b7280;
      display: none;
    }
    .loading.visible { display: block; }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #e5e7eb;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 8px;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      padding: 8px 16px;
      text-align: center;
      font-size: 10px;
      color: #9ca3af;
      border-top: 1px solid #e9ecef;
    }

    .footer a { color: #667eea; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a2e;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      z-index: 9999;
      animation: fadeInUp 0.2s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <span style="font-size: 22px;">🌐</span>
    <h1>webreader</h1>
    <span class="version">v0.1.0</span>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span id="statusText"><span class="status-dot disconnected" id="statusDot"></span>Connecting...</span>
    <span id="charCount"></span>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-primary" id="readCurrentBtn" onclick="readCurrentTab()">
      <span class="btn-icon">📄</span>
      Read This Page
    </button>
    <button class="btn btn-secondary" id="copyBtn" onclick="copyResult()" disabled>
      <span class="btn-icon">📋</span>
      Copy Markdown
    </button>
    <button class="btn btn-secondary" id="openCliBtn" onclick="showCliHint()">
      <span class="btn-icon">💻</span>
      CLI Usage
    </button>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div id="loadingText">Reading page...</div>
  </div>

  <!-- Output -->
  <pre class="output-area" id="output"></pre>

  <!-- Footer -->
  <div class="footer">
    <a href="https://github.com/YOUR_USER/webreader" target="_blank">webreader</a> · 
    Read the web through your own browser
  </div>

  <script src="popup.js"></script>
</body>
</html>
