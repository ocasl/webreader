<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  
  <!-- Globe icon -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="white" stroke-width="4"/>
  <ellipse cx="64" cy="64" rx="18" ry="38" fill="none" stroke="white" stroke-width="3"/>
  <line x1="26" y1="64" x2="102" y2="64" stroke="white" stroke-width="3"/>
  <line x1="64" y1="26" x2="64" y2="102" stroke="white" stroke-width="3"/>
  
  <!-- Small "R" for reader badge -->
  <circle cx="96" cy="32" r="16" fill="#22c55e"/>
  <text x="96" y="39" text-anchor="middle" font-size="20" font-weight="bold" fill="white">R</text>
</svg>
